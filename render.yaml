services:
  - type: web
    name: reelposter
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 0 --bind 0.0.0.0:$PORT render_app:application
    healthCheckPath: /api/health
    envVars:
      - key: REELPOSTER_DATA_DIR
        value: /opt/render/project/src/data
      - key: TELEGRAM_BOT_ENABLED
        value: "false"
      - key: REELPOSTER_BACKGROUND_WORKERS
        value: "1"
      - key: FFMPEG_THREADS
        value: "1"
      - key: FFMPEG_PRESET
        value: veryfast
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: IG_GRAPH_API_VERSION
        value: v25.0
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: IG_DM_ALLOWED_SENDER_IDS
        sync: false
      - key: REELPOSTER_WEB_USERNAME
        value: reelposter
      - key: REELPOSTER_WEB_PASSWORD
        sync: false
